name:                HTPL-thesis
version:             0.1.0.0
github:              "4Patrick2/HTPL-thesis"
license:             BSD-3-Clause
author:              "Patrick Mørch"
maintainer:          "fmp334@alumni.ku.dk"
copyright:           "2024 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/4Patrick2/HTPL-thesis#readme>

dependencies:
- base >= 4.7 && < 5
- text
- containers
- megaparsec >= 9.2.2
- parser-combinators >= 1.3.0
- mtl >= 2.2.2
- monad-validate >= 1.2.0.1
- partial-order
- multimap >= 1.2.1

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -Wno-incomplete-patterns
- -Wno-unused-top-binds
- -Wtype-defaults
- -Wno-missing-signatures
- -Wno-unused-matches
- -Wno-name-shadowing
- -Wno-overlapping-patterns
- -Wno-unused-do-bind

library:
  source-dirs: 
  - src
  - simulator
  ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wno-incomplete-patterns
  - -Wno-unused-top-binds
  - -Wtype-defaults
  - -Wno-missing-signatures
  - -Wno-unused-matches
  - -Wno-name-shadowing
  - -Wno-unused-imports
  - -Wno-overlapping-patterns
  - -Wno-unused-do-bind

executables:
  HTPL:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -Wcompat
    - -Widentities
    - -Wincomplete-record-updates
    - -Wincomplete-uni-patterns
    - -Wmissing-export-lists
    - -Wmissing-home-modules
    - -Wpartial-fields
    - -Wredundant-constraints
    - -Wno-incomplete-patterns
    - -Wno-unused-top-binds
    - -Wtype-defaults
    - -Wno-missing-signatures
    - -Wno-unused-matches
    - -Wno-name-shadowing
    - -Wno-unused-imports
    - -Wno-overlapping-patterns
    - -Wno-unused-do-bind
    dependencies:
    - HTPL-thesis
    - text
    - containers
    - megaparsec >= 9.2.2
    - parser-combinators >= 1.3.0

tests:
  HTPL-thesis-test:
    main:                ParserTests.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    - -Wcompat
    - -Widentities
    - -Wincomplete-record-updates
    - -Wincomplete-uni-patterns
    - -Wmissing-export-lists
    - -Wmissing-home-modules
    - -Wpartial-fields
    - -Wredundant-constraints
    - -Wno-incomplete-patterns
    - -Wno-unused-top-binds
    - -Wtype-defaults
    - -Wno-missing-signatures
    - -Wno-unused-matches
    - -Wno-name-shadowing
    - -Wno-unused-imports
    - -Wno-overlapping-patterns
    - -Wno-unused-do-bind
    dependencies:
    - HTPL-thesis
    - tasty
    - tasty-hunit